<!doctype html>
<html lang="en">
  <head>
    <!-- =========================
         CHARACTER ENCODING
    ========================== -->
    <meta charset="UTF-8" />

    <!-- =========================
         RESPONSIVE
    ========================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================
         PERFORMANCE: HERO PRELOAD (homepage only)
         Lets the browser fetch the LCP image in parallel with the JS bundle.
    ========================== -->
    <script>
      if (location.pathname === "/") {
        [
          ["(max-width: 1023.98px)", "/images/hero/hero-mobile-480.webp 480w, /images/hero/hero-mobile-768.webp 768w, /images/hero/hero-mobile-853.webp 853w"],
          ["(min-width: 1024px)", "/images/hero/hero-desktop-1280.webp 1280w, /images/hero/hero-desktop-1672.webp 1672w"]
        ].forEach(function (p) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.media = p[0];
          l.setAttribute("imagesrcset", p[1]);
          l.setAttribute("imagesizes", "100vw");
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        });
      }
    </script>

    <!-- Backend API (content is fetched on page load) -->
    <link rel="preconnect" href="https://kavuturu-backend.vercel.app" crossorigin />

    <!-- =========================
         GOOGLE ANALYTICS (GA4)
         gtag.js is loaded on the first user interaction (or after 8s) so it
         doesn't block the main thread while the page is loading. Events
         pushed before then are queued in dataLayer and sent once it loads.
    ========================== -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-DEEZ1ZZ7FK");

      (function () {
        var loaded = false;
        var events = ["pointerdown", "keydown", "touchstart", "mousemove", "wheel"];
        function loadGA() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) {
            removeEventListener(e, loadGA);
          });
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-DEEZ1ZZ7FK";
          document.head.appendChild(s);
        }
        events.forEach(function (e) {
          addEventListener(e, loadGA, { once: true, passive: true });
        });
        addEventListener("load", function () {
          setTimeout(loadGA, 8000);
        });
      })();
    </script>

    <!-- =========================
         DEFAULT SEO
         React Helmet overrides
         this on individual pages
    ========================== -->
    <title>
      Kavuturu Dental Clinic | Best Dental Clinic & Dentist in Tirupati
    </title>

    <meta
      name="description"
      content="Kavuturu Dental Clinic is a trusted dental clinic in Tirupati offering dental implants, root canal treatment, smile makeovers, cosmetic dentistry, teeth whitening, braces, and complete family dental care with advanced technology."
    />

    <!-- =========================
         THEME COLOR
    ========================== -->
    <meta
      name="theme-color"
      content="#0E2A6D"
    />

    <!-- =========================
         FAVICON
    ========================== -->

    <!-- ICO fallback -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <!-- 16x16 favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- 32x32 favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <!-- 192x192 favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />

    <!-- 512x512 favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon-512x512.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- =========================
         WEB APP MANIFEST
    ========================== -->
    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- =========================
         GOOGLE FONTS
    ========================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Loaded without blocking first paint (font-display: swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      />
    </noscript>
  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <!-- React Entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
